version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: medflow-postgres
    environment:
      POSTGRES_DB: medflowdb
      POSTGRES_USER: medflow
      POSTGRES_PASSWORD: medflow123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medflow-network

  activemq:
    image: apache/activemq-artemis:2.28.0
    container_name: medflow-activemq
    environment:
      ARTEMIS_USER: admin
      ARTEMIS_PASSWORD: admin
    ports:
      - "8161:8161"
      - "61616:61616"
    networks:
      - medflow-network

  wildfly:
    build: .
    container_name: medflow-wildfly
    ports:
      - "8080:8080"
      - "9990:9990"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: medflowdb
      POSTGRES_USER: medflow
      POSTGRES_PASSWORD: medflow123
      ACTIVEMQ_HOST: activemq
    depends_on:
      - postgres
      - activemq
    networks:
      - medflow-network
    volumes:
      - ./target/medflow-distributor.war:/opt/jboss/wildfly/standalone/deployments/medflow-distributor.war

networks:
  medflow-network:
    driver: bridge

volumes:
  postgres_data:
