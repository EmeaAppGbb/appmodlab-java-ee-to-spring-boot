<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/xml/ns/javaee/html"
      xmlns:f="http://xmlns.jcp.org/xml/ns/javaee/faces"
      xmlns:ui="http://xmlns.jcp.org/xml/ns/javaee/facelets"
      lang="en">
<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>MedFlow Distributors - <ui:insert name="title">Application</ui:insert></title>
    <h:outputStylesheet library="css" name="styles.css"/>
    <ui:insert name="head"/>
</h:head>
<h:body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <h1>MedFlow Distributors</h1>
            <nav class="nav-links">
                <h:link outcome="index" value="Home"/>
                <h:link outcome="dashboard" value="Dashboard"/>
                <h:link outcome="productSearch" value="Product Search"/>
                <h:link outcome="inventory" value="Inventory"/>
                <h:link outcome="orderWizard" value="Create Order"/>
            </nav>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="content">
        <div class="container">
            <ui:insert name="content">
                <!-- Default content if not overridden -->
            </ui:insert>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2024 MedFlow Distributors. All rights reserved.</p>
    </footer>
</h:body>
</html>
